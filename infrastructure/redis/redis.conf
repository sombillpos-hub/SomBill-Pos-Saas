# Redis for SomBill: API-gateway rate limits (shared by every gateway instance). Mounted by the Compose stack.
# The password is passed on the command line from REDIS_PASSWORD (never stored here).
bind 0.0.0.0
protected-mode yes
port 6379

# Persistence: append-only file, fsync every second (rate-limit counters survive a restart).
appendonly yes
appendfsync everysec

# Rate-limit keys must never be evicted silently; refuse writes instead when memory is full.
maxmemory 256mb
maxmemory-policy noeviction

# Disable commands nobody should run against this instance.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
