# Public entry point: /api and /health go to the API gateway, everything else to the dashboards. Terminate TLS here in production (see the commented server block).
worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 1m;
  gzip on;
  gzip_types application/json text/css application/javascript;

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent rt=$request_time id=$request_id';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  upstream api_gateway {
    server api-gateway:4000;
    keepalive 32;
  }

  upstream dashboards {
    server dashboards:80;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 80;
    server_name _;

    # Uploads (POST /api/v1/files): the API enforces UPLOAD_MAX_BYTES (5 MB default); allow a little multipart overhead.
    location /api/v1/files {
      client_max_body_size 6m;
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_request_buffering off;
      proxy_read_timeout 60s;
    }

    # Realtime Server-Sent Events (SSE) stream: disable buffering so kitchen/POS updates arrive instantly.
    location /api/v1/realtime {
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header Connection '';
      proxy_buffering off;
      proxy_cache off;
      chunked_transfer_encoding off;
      proxy_read_timeout 3600s;
    }

    # API, API docs and health checks go through the gateway: /api/v1/*, /api/docs, /health/*
    location ~ ^/(api|health)(/|$) {
      proxy_pass http://api_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Replace (not append) so clients cannot spoof their address through the chain.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      # WebSocket upgrade (Socket.IO, later phases)
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 60s;
    }

    # Single-page dashboards (static files; the dashboards image does its own SPA fallback)
    location / {
      proxy_pass http://dashboards;
      proxy_set_header Host $host;
    }
  }

  # Production TLS (Let's Encrypt or your certificates):
  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name api.sombill.com;
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #   location ~ ^/(api|health)(/|$) { ...same as above... }
  #   location / { proxy_pass http://dashboards; }
  # }
  # server { listen 80; server_name api.sombill.com; return 301 https://$host$request_uri; }
}
