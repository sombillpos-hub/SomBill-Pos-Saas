# RabbitMQ for SomBill: domain events between modules (transactional outbox → topic exchange → module queues).
# Mounted as /etc/rabbitmq/conf.d/90-sombill.conf. User and password come from RABBITMQ_USER / RABBITMQ_PASSWORD.

# The built-in guest account may only connect from inside the container.
loopback_users.guest = true

# Flow control: block publishers before the broker runs out of memory or disk.
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# Detect dead TCP connections from crashed API instances.
heartbeat = 30

# Log to the console (collected by Docker).
log.console = true
log.console.level = info
